<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APM - Academia de Polícia Militar (System)</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* ============ PALETA (troque aqui para mudar as cores do site inteiro) ============ */
  :root {
    --apm-primary: #7a1c2c;        /* vermelho vinho */
    --apm-primary-hover: #5f1522;
    --apm-primary-dark: #3d0d16;
    --apm-primary-light: #9b2a3c;
    --apm-primary-soft: #fbeff1;   /* fundo claro (badges, item ativo) */
    --apm-primary-soft-border: #f3d3d9;
    --apm-accent: #c9a24a;         /* dourado (detalhes) */
    --apm-bg: #f6f4f4;
    --apm-card: #ffffff;
    --apm-text: #1f1416;
    --apm-muted: #6b6264;
    --apm-subtle: #a19a9b;
    --apm-border: #ece7e8;
    --apm-hover: #f5f0f1;
    --apm-primary-claro: #e8a0ad;  /* vinho-claro (texto sobre fundo escuro) */
    --apm-mural-card: #16181c;     /* fundo dos cards do Mural (grafite) */
  }

  /* Fonte do site. Os ícones do Font Awesome (<i> e classes fa-*) ficam de fora:
     um seletor com #id tem prioridade sobre .fa-solid e trocaria a fonte dos
     ícones, que aparecem como quadrados vazios. */
  #apm-root, #apm-bloqueio, #apm-toast, #apm-dev-badge,
  #apm-root *:not(i):not(.fa):not([class^="fa-"]):not([class*=" fa-"]),
  #apm-bloqueio *:not(i):not(.fa):not([class^="fa-"]):not([class*=" fa-"]) {
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  body { background: var(--apm-bg); color: var(--apm-text); }

  .glass-card {
    background: var(--apm-card);
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(61,13,22,0.06);
    border: 1px solid rgba(61,13,22,0.05);
  }

  /* ---------- Sidebar ---------- */
  #apm-sidebar {
    width: 260px;
    position: sticky;
    top: 16px;
    align-self: flex-start;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    z-index: 70;
    transition: transform .25s ease;
  }
  #apm-mobile-topbar { display: none; }
  #apm-sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(31,20,22,0.5); z-index: 60;
  }
  #apm-sidebar-backdrop.open { display: block; }

  @media (max-width: 900px) {
    #apm-mobile-topbar { display: flex; }
    #apm-sidebar { position: fixed; inset: 0 auto 0 0; height: 100vh; max-height: 100vh; width: 280px; margin: 0; border-radius: 0; transform: translateX(-100%); }
    #apm-sidebar.open { transform: translateX(0); }
    #apm-btn-fechar-menu { display: block !important; }
  }

  .apm-logo {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--apm-primary-light), var(--apm-primary-dark));
    color: var(--apm-accent); font-size: 18px;
  }
  .apm-logo img { max-width: 100%; max-height: 100%; }

  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px; border-radius: 12px;
    font-size: 14px; font-weight: 600; color: var(--apm-muted);
    cursor: pointer; transition: all .15s ease; text-decoration: none;
  }
  .nav-item:hover { background: var(--apm-hover); color: var(--apm-text); }
  .nav-item.active { background: var(--apm-primary); color: #fff; }
  .nav-item:focus-visible, .apm-card-click:focus-visible, .btn-primary:focus-visible { outline: 2px solid var(--apm-accent); outline-offset: 2px; }
  .nav-item i { width: 18px; text-align: center; }
  .nav-item .nav-lock { margin-left: auto; font-size: 11px; color: var(--apm-subtle); width: auto; }
  .nav-item.active .nav-lock { color: rgba(255,255,255,.7); }
  .nav-item.locked { color: #c9c1c3; }

  .nav-secao-label {
    font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
    color: var(--apm-subtle); padding: 14px 16px 4px;
  }

  /* ---------- Botões / badges ---------- */
  .btn-primary {
    background: var(--apm-primary); color: #fff;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 12px; font-size: 14px; font-weight: 700;
    transition: background .15s ease, transform .1s ease; text-decoration: none;
  }
  .btn-primary:hover { background: var(--apm-primary-hover); }
  .btn-primary:active { transform: scale(0.98); }

  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px;
    border-radius: 999px; background: var(--apm-primary-soft); color: var(--apm-primary);
  }
  .badge-gold { background: #fbf4e2; color: #8a6a1f; }

  .text-primary { color: var(--apm-primary); }
  .text-muted { color: var(--apm-muted); }
  .text-subtle { color: var(--apm-subtle); }
  .icon-box {
    width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--apm-primary-soft); color: var(--apm-primary); font-size: 17px;
  }

  /* ---------- Hero ---------- */
  .apm-hero {
    --apm-hero-img: none;
    /* camada vinho por cima do banner para o texto continuar legível */
    background:
      linear-gradient(90deg, rgba(61,13,22,.94) 0%, rgba(122,28,44,.80) 50%, rgba(122,28,44,.35) 100%),
      var(--apm-hero-img) center / cover no-repeat,
      linear-gradient(135deg, var(--apm-primary-dark), var(--apm-primary) 60%, var(--apm-primary-light));
    border: none;
  }
  @media (max-width: 640px) {
    .apm-hero { background:
      linear-gradient(180deg, rgba(61,13,22,.88), rgba(122,28,44,.88)),
      var(--apm-hero-img) center / cover no-repeat,
      var(--apm-primary-dark); }
  }

  /* Nicks com pontuação/sem espaços (.:Persceu:., Wingeet:) quebram sem estourar o layout */
  .apm-nick { overflow-wrap: anywhere; word-break: break-word; }

  /* ---------- Linha do tempo (Histórico) ---------- */
  .apm-timeline { position: relative; margin: 0; padding: 0 0 0 22px; list-style: none; }
  .apm-timeline::before {
    content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px;
    width: 2px; background: var(--apm-primary-soft-border);
  }
  .apm-timeline li { position: relative; padding-bottom: 18px; }
  .apm-timeline li:last-child { padding-bottom: 0; }
  .apm-timeline li::before {
    content: ''; position: absolute; left: -21px; top: 4px;
    width: 12px; height: 12px; border-radius: 999px;
    background: var(--apm-card); border: 3px solid var(--apm-primary);
  }
  .apm-timeline li:last-child::before { background: var(--apm-accent); border-color: var(--apm-accent); }

  /* Marcador de conteúdo pendente */
  .apm-preencher { background: #fef3c7; color: #92400e; padding: 0 4px; border-radius: 4px; font-weight: 700; }
  .apm-hero-soft { color: rgba(255,255,255,.75); }
  .apm-hero-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.14); color: #fff;
  }
  .apm-hero-chip.gold { background: rgba(201,162,74,.25); color: #f6e3b3; }
  #apm-hero .avatar-crop { height: 145px !important; border: none !important; }

  /* ---------- Avatares ---------- */
  .avatar-crop {
    position: relative; overflow: hidden; background: #f1ecec;
    display: inline-block; flex-shrink: 0; vertical-align: middle;
  }
  .avatar-crop img { position: absolute; max-width: none; }

  /* ---------- Cards clicáveis ---------- */
  .apm-card-click { cursor: pointer; transition: all .15s ease; display: block; text-decoration: none; color: inherit; }
  .apm-card-click:hover:not(.locked) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(61,13,22,0.12); }
  .apm-card-click.locked { cursor: not-allowed; opacity: .55; }

  /* ---------- Insígnias (E-Academy) ---------- */
  .apm-insignia-modulo { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
  .apm-insignia-secao { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }

  /* ---------- Mural (estilo WaveX) ---------- */
  .mural-titulo { text-align: center; margin: 8px 0 4px; }
  .mural-titulo h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: .08em; line-height: 1; color: var(--apm-primary); }
  .mural-titulo p { margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--apm-subtle); }

  /* 1 coluna no celular, 2 no tablet, 3 no desktop; cards de no máximo 320px, grid centralizado */
  .mural-grid {
    display: grid; grid-template-columns: minmax(0, 320px); justify-content: center;
    gap: 36px 16px; padding-top: 34px;
  }
  @media (min-width: 640px)  { .mural-grid { grid-template-columns: repeat(2, minmax(0, 320px)); } }
  @media (min-width: 1280px) { .mural-grid { grid-template-columns: repeat(3, minmax(0, 320px)); } }

  .mural-card {
    position: relative; height: 72px; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    /* esquerda = 12px de margem + largura do busto + respiro (definido via --mural-busto-w) */
    padding: 0 16px 0 calc(12px + var(--mural-busto-w, 77px) + 8px);
    border-radius: 12px; background: var(--apm-mural-card);
    border: 1px solid rgba(255,255,255,.06);
  }
  .mural-card.comandante { border-color: var(--apm-accent); }

  /* Busto: janela com overflow:hidden que corta na cintura, alinhada à base do card.
     Só a cabeça passa por cima do card. Tamanhos vêm de CONFIG.muralAvatar. */
  .mural-busto {
    position: absolute; left: 12px; bottom: 0; overflow: hidden; pointer-events: none;
  }
  .mural-busto img {
    position: absolute; max-width: none;
    image-rendering: crisp-edges;   /* fallback (Firefox antigo) */
    image-rendering: pixelated;     /* pixels nítidos, sem borrar */
    transition: filter .3s ease, opacity .3s ease;
  }
  .mural-grid.cinza-offline .mural-card.offline .mural-busto img { filter: grayscale(1); opacity: .55; }

  .mural-info { flex: 1; min-width: 0; text-align: center; }
  .mural-nick {
    color: #fff; font-weight: 800; font-size: 14px; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mural-cargo {
    margin-top: 3px; font-size: 9px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--apm-primary-claro);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mural-card.comandante .mural-cargo { color: var(--apm-accent); }
  .mural-status {
    width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0;
    background: #6b7280; transition: background .2s ease, box-shadow .2s ease;
  }
  .mural-status.carregando { animation: apm-pulso 1.2s ease-in-out infinite; }
  .mural-status.online { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.7); }
  .mural-status.offline { background: #ef4444; }
  @keyframes apm-pulso { 50% { opacity: .35; } }

  /* ---------- Regimento Interno (tudo escopado em .apm-regimento) ---------- */
  .apm-regimento .reg-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (min-width: 1024px) { .apm-regimento .reg-layout { grid-template-columns: 250px minmax(0, 1fr); } }
  .apm-regimento .reg-sumario { padding: 16px; }
  @media (min-width: 1024px) { .apm-regimento .reg-sumario { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; } }
  .apm-regimento .reg-sumario-titulo {
    font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: var(--apm-subtle); padding: 0 8px 8px;
  }
  .apm-regimento .reg-sumario-item {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
    padding: 8px; border-radius: 10px; font-size: 12.5px; font-weight: 600; color: var(--apm-muted);
    transition: background .15s ease, color .15s ease;
  }
  .apm-regimento .reg-sumario-item:hover { background: var(--apm-hover); color: var(--apm-text); }
  .apm-regimento .reg-sumario-item:focus-visible { outline: 2px solid var(--apm-accent); outline-offset: 1px; }
  .apm-regimento .reg-sumario-item.reg-sem-resultado { opacity: .4; }
  .apm-regimento .reg-sumario-num {
    min-width: 30px; text-align: center; font-size: 11px; font-weight: 800; padding: 2px 6px;
    border-radius: 6px; background: var(--apm-primary-soft); color: var(--apm-primary);
  }
  .apm-regimento .reg-sumario-nome { line-height: 1.35; }
  .apm-regimento .reg-busca { display: flex; align-items: center; gap: 10px; padding: 10px 16px; margin-bottom: 16px; color: var(--apm-subtle); }
  .apm-regimento .reg-busca input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; color: var(--apm-text); padding: 4px 0; }
  .apm-regimento .reg-busca:focus-within { box-shadow: 0 0 0 2px var(--apm-primary-soft-border), 0 4px 24px rgba(61,13,22,0.06); }
  .apm-regimento .reg-contagem { font-size: 12px; font-weight: 700; color: var(--apm-primary); white-space: nowrap; }
  .apm-regimento .reg-vazio { text-align: center; font-size: 14px; color: var(--apm-muted); padding: 32px 0; }
  .apm-regimento .reg-texto { padding: 20px; color: var(--apm-text); font-size: 14.5px; line-height: 1.7; overflow-wrap: anywhere; }
  @media (min-width: 768px) { .apm-regimento .reg-texto { padding: 32px 36px; } }
  .apm-regimento .reg-texto p { margin: 0 0 7px; }
  .apm-regimento .reg-texto strong { color: var(--apm-primary); font-weight: 700; }
  .apm-regimento .reg-texto em { color: var(--apm-muted); }
  /* Cabeçalho do documento */
  .apm-regimento .reg-texto .hero {
    background: linear-gradient(135deg, var(--apm-primary-dark), var(--apm-primary) 60%, var(--apm-primary-light));
    color: #fff; border-radius: 16px; padding: 28px 24px; margin-bottom: 20px; text-align: center;
  }
  .apm-regimento .reg-texto .hero h1 { font-size: clamp(1.25rem, 2.6vw, 1.85rem); font-weight: 800; line-height: 1.25; margin: 0 0 6px; color: #fff; }
  .apm-regimento .reg-texto .hero p { margin: 0; color: rgba(255,255,255,.78); font-size: 13px; font-weight: 600; }
  /* Capítulos */
  .apm-regimento .reg-texto .chapter {
    scroll-margin-top: 16px; margin: 32px 0 4px; padding: 10px 18px; border-radius: 12px;
    background: var(--apm-primary); color: #fff;
  }
  .apm-regimento .reg-texto .chapter h2 { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; }
  .apm-regimento .reg-capitulo-nome { margin: 8px 0 12px 4px !important; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--apm-primary); }
  /* Artigos e parágrafos */
  .apm-regimento .reg-texto .article, .apm-regimento .reg-texto .card {
    border: 1px solid var(--apm-border); border-left: 4px solid var(--apm-primary);
    border-radius: 12px; padding: 12px 16px; margin: 10px 0; background: var(--apm-card);
  }
  .apm-regimento .reg-texto .card { background: var(--apm-hover); border-left-color: var(--apm-primary-soft-border); margin-left: 12px; }
  .apm-regimento .reg-texto .article p:last-child, .apm-regimento .reg-texto .card p:last-child { margin-bottom: 0; }
  .apm-regimento .reg-texto .note {
    background: var(--apm-primary-soft); border: 1px solid var(--apm-primary-soft-border); border-left: 4px solid var(--apm-primary);
    border-radius: 12px; padding: 12px 16px; margin: 12px 0;
  }
  /* Tabela (Art. 7º) */
  .apm-regimento .reg-texto table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 12px 0; font-size: 13.5px; border: 1px solid var(--apm-border); border-radius: 12px; overflow: hidden; }
  .apm-regimento .reg-texto td, .apm-regimento .reg-texto th { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--apm-border); vertical-align: top; }
  .apm-regimento .reg-texto tr:last-child td { border-bottom: 0; }
  .apm-regimento .reg-texto tr:first-child td { background: var(--apm-primary-soft); font-weight: 800; }
  @media (max-width: 560px) { .apm-regimento .reg-texto table { display: block; overflow-x: auto; } }
  .apm-regimento .reg-oculto { display: none !important; }
  .apm-regimento mark.reg-destaque { background: #fbe7a8; color: inherit; padding: 0 2px; border-radius: 3px; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 24px; right: 24px; max-width: 360px;
    padding: 14px 18px; border-radius: 14px; font-size: 14px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15); opacity: 0; transform: translateY(12px);
    transition: opacity .2s ease, transform .2s ease; pointer-events: none; z-index: 300;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .toast.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .toast.info { background: var(--apm-primary-soft); color: var(--apm-primary); border: 1px solid var(--apm-primary-soft-border); }
  @media (max-width: 480px) { .toast { left: 16px; right: 16px; max-width: none; } }

  .skeleton {
    background: linear-gradient(90deg, #f1eded 25%, #e8e2e3 37%, #f1eded 63%);
    background-size: 400% 100%; animation: skeleton 1.4s ease infinite; border-radius: 8px;
  }
  @keyframes skeleton { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  #apm-dev-badge {
    position: fixed; left: 16px; bottom: 16px; z-index: 250;
    background: #fbbf24; color: #3b2a00; font-size: 11px; font-weight: 800;
    padding: 6px 10px; border-radius: 999px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
</style>

<!-- ============ TEXTO DO REGIMENTO INTERNO ============
     Conteúdo de conteudo/regimento.html (com as correções aprovadas).
     Vazio = a página do Regimento mostra "Em breve". -->
<template id="apm-regimento-fonte">
<div class="hero"><h1>Regimento Interno da Academia da Polícia Militar</h1><p>Central Intelligence Agency — APM/CFO</p></div>
<section class="chapter"><h2>CAPÍTULO I</h2></section>
<p>DISPOSIÇÕES GERAIS</p>
<article class="article"><p> <strong>Art. 1° -</strong> A <strong>Academia de Polícia Militar (APM)</strong> é formada pela união e cooperação de todos os membros que nele estejam, sejam eles da ativa, licença ou reserva.</p></article>
<article class="article"><p> <strong>Art. 2° -</strong> Todos os membros da Academia de Polícia Militar (APM) devem seguir normas do Regimento Interno, estando sujeito à &nbsp;punição caso não haja cumprimento da lei.</p></article>
<article class="article"><p> <strong>Art. 3° -</strong> Constituem os objetivos fundamentais da Academia de Polícia Militar:</p></article>
<div class="card">
<p><strong>I.</strong> Garantir o ensino de qualidade, doutrinando e ensinando os policiais da melhor maneira possível, dando auxilio e suporte necessário aos policiais que necessitem;</p>
<p><strong>II.</strong> Cooperação entre seus membros, por estarem sempre ativos e dispostos, a fim de garantir a excelência da academia;</p>
<p><strong>III.</strong> Transparência na informação, por sempre estar aberta a ideias e novas sugestões, além de garantir a ciência das informações sobre a academia a seus membros.</p>
</div>
<article class="article"><p> <strong>Art. 4° -</strong> A Academia da Polícia Militar (APM) é a subcompanhia responsável pela organização, aplicação e acompanhamento do Curso de Formação de Oficiais (CFO), destinado à qualificação dos policiais que passam da condição de praça para oficial. Compete à APM promover a formação, o aperfeiçoamento e a avaliação dos futuros oficiais da Central Intelligence Agency, observando a Constituição Militar, o Código Penal Militar, o Código de Conduta do Oficialato e os demais documentos oficiais da instituição.</p></article>
<div class="card">
<p><strong>§ 1º -</strong> Todos os membros da APM deverão favoritar o grupo oficial “[CIA] Academia de PM ®” em seu perfil durante o período de vínculo com a subcompanhia.</p>
<p><strong>§ 2º -</strong> Os membros que exercerem a função de Instrutor deverão portar obrigatoriamente o brevê vermelho, como identificação oficial da função, sempre que estiverem representando ou atuando pela APM.</p>
<p><strong>§ 3º -</strong> Apenas oficiais poderão integrar a APM, mediante processo seletivo, indicação ou teste de admissão autorizado pela liderança competente.</p>
<p><strong>§ 4º -</strong> O CFO será composto por três módulos: I. Módulo I — Avaliação de Conhecimentos Gerais; II. Módulo II — Carreira, Militarismo e Conduta; III. Módulo III — Comando de Base, Direitos, Código Penal Militar e Crises.</p>
<p><strong>§ 5º -</strong> O Módulo I será aplicado diretamente no Centro de Instruções, enquanto os Módulos II e III terão seu conteúdo teórico enviado por mensagem privada, devendo o candidato realizar a respectiva avaliação no prazo máximo de 24 horas após o recebimento da aula.</p>
<p><strong>§ 6º -</strong> A hierarquia interna da Academia da Polícia Militar será composta por: I. Comandante {Cmd.APM}; II. Subcomandante {SCmd.APM}; III. Coordenador {Coord.APM}; IV. Instrutor {APM}.</p>
<p><strong>§ 7º -</strong> Todos os membros da APM deverão cumprir suas atribuições com disciplina, responsabilidade, imparcialidade, sigilo e respeito à hierarquia, estando sujeitos às normas da Constituição Militar, do Código Penal Militar, do Código de Conduta do Oficialato e deste Regimento Interno.</p>
<p><strong>§ 8º -</strong> A Academia da Polícia Militar também será responsável pela organização, aplicação e acompanhamento dos Aperfeiçoamentos de Formação de Oficiais (AFO), destinados ao treinamento e desenvolvimento dos integrantes do Corpo Executivo da Central Intelligence Agency.</p>
<p><strong>§ 9º -</strong> Os AFO serão divididos nas seguintes especializações:</p>
<p><strong>I.</strong> <strong>AFO | Especialização Básica — Funções, Segurança e Carreira:</strong> destinada aos integrantes do Corpo Executivo a partir do cargo de Supervisor;</p>
<p><strong>II.</strong> <strong>AFO | Especialização Intermediária — Gestão, Conduta e Desenvolvimento:</strong> destinada aos integrantes do Corpo Executivo a partir do cargo de Inspetor;</p>
<p><strong>III.</strong> <strong>AFO | Especialização Avançada — Liderança, CPM e Gerenciamento de Crises:</strong> destinada aos integrantes do Corpo Executivo a partir do cargo de VIP.</p>
<p><strong>§ 10º -</strong> A aplicação dos AFO deverá observar os scripts, critérios e procedimentos definidos pela liderança da APM, respeitando os documentos oficiais da CIA.</p>
</div>
<section class="chapter"><h2>CAPÍTULO II</h2></section>
<p>HIERARQUIA, FUNÇÕES E METAS</p>
<article class="article"><p> <strong>Art. 5° -</strong> A hierarquia da Academia de Polícia Militar é composta por 4 (quatro) cargos. São eles, em ordem hierárquica (do menor para o maior):</p></article>
<div class="card">
<p><strong>I.</strong> Instrutor {APM};</p>
<p><strong>II.</strong> Coordenador {Coord.APM};</p>
<p><strong>III.</strong> Subcomandante {SCmd.APM};</p>
<p><strong>IV.</strong> Comandante {Cmd.APM}.</p>
</div>
<article class="article"><p> <strong>Art. 6° -</strong> Seguem as funções internas de cada cargo e seu respectivo número de vagas:</p></article>
<div class="card">
<p><strong>I.</strong> Os instrutores são responsáveis pela aplicação do Curso de Formação de Oficiais exclusivamente aos Aspirantes a Oficial, incluindo o envio das aulas, a aplicação das avaliações e o acompanhamento dos candidatos. Dispõe-se de 6 vagas para o cargo de instrutor;</p>
<p><strong>II.</strong> Os coordenadores são responsáveis pelas tarefas estruturais que mantêm a função organizada. Dispõe-se de 3 vagas para o cargo de coordenador;</p>
<p><strong>III.</strong> O subcomandante é responsável por auxiliar o comandante em suas obrigações (bem como no processo seletivo) e representá-lo em sua ausência. Dispõe-se de 1 vaga para o cargo de subcomandante;</p>
<p><strong>IV.</strong> O comandante é responsável por conduzir a função garantindo a eficácia no processo de formação dos oficiais da Central Intelligence Agency. Dispõe-se de 1 vaga para o cargo de comandante.</p>
<p><strong>§ 1°</strong> A meta dos instrutores é de 1 (uma) aplicação por semana, considerando que uma aplicação corresponde à aula/apostila do tema + atividade do tema.</p>
<p><strong>§ 2°</strong> A partir do cargo de coordenador, os integrantes terão metas flexíveis definidas pelo Comando da Academia de Polícia Militar.</p>
</div>
<article class="article"><p> <strong>Art. 7° -</strong> Estabelece-se como padrão de gratificações pelo cumprimento ou não da meta:</p></article>

<p><strong>§ 1°</strong> O instrutor que não cumprir a meta semanal por duas semanas consecutivas receberá, ao término da segunda semana, as gratificações referentes ao não cumprimento da meta e será expulso da função, levando consigo outras 200 gratificações negativas.</p>
<p><strong>§ 2°</strong> O coordenador que não cumprir a meta quinzenal por duas quinzenas consecutivas receberá, ao término da segunda quinzena, as gratificações referentes ao não cumprimento da meta e será rebaixado ao cargo de instrutor.</p>
</div>
<section class="chapter"><h2>CAPÍTULO III</h2></section>
<p>CRIMES ADMINISTRATIVOS</p>
<article class="article"><p> <strong>Art. 8° -</strong> Considera-se crime administrativo na Academia de Polícia Militar, todo e qualquer ato de omissão de informações, abandono de dever/negligência, conduta imprópria e qualquer outro tipo de comportamento que não condiz com os valores da academia.</p></article>
<article class="article"><p> <strong>Art. 9° -</strong> O membro que permanecer ausente da Academia de Polícia Militar por período igual ou superior a 5 (cinco) dias, sem apresentar justificativa ou solicitar licença conforme as normas deste Regimento, será desligado da Academia por abandono de dever, ressalvados os casos devidamente autorizados pelo Comando da APM.</p></article>
<article class="article"><p> <strong>Art. 10° -</strong> O membro da Academia de Polícia Militar que for pego pulando script ou falsificando aula será expulso da academia, levando 200 gratificações negativas.</p></article>
<article class="article"><p> <strong>Art. 11° -</strong> É absolutamente proibido manipular/falsificar provas para prejudicar outro membro. Caso o membro use de má fé, seja ela com utilização de print's falsos ou não, estará cometendo o crime de falsificação de informações.</p></article>
<article class="article"><p> <strong>Art. 12° -</strong> Segue abaixo motivos para advertências e suas punições:</p></article>
<div class="card">
<p><strong>I.</strong> <strong>Postagem Duplicada:</strong> advertência verbal, em caso de reincidência, agrava-se tal punição.</p>
<p><strong>II.</strong> <strong>Erros de horários/datas:</strong> advertência verbal, em caso de reincidência, agrava-se tal punição.</p>
<p><strong>III.</strong> <strong>Considerar questões incorretas:</strong> advertência verbal, dependendo da gravidade, agrava-se tal punição.</p>
<p><strong>IV.</strong> <strong>Negligências na aplicação de aulas/avaliações:</strong> advertência escrita, dependendo da gravidade, agrava-se tal punição.</p>
<p><strong>V.</strong> <strong>Negligências na realização de funções:</strong> advertência escrita, dependendo da gravidade, agrava-se tal punição.</p>
<p><strong>VI.</strong> <strong>Reincidência ou deliberados erros:</strong> advertência escrita, dependendo da gravidade, agrava-se tal punição.</p>
<p><strong>Parágrafo único.</strong> &nbsp;O membro receberá uma advertência na Academia de Polícia Militar caso deixe de postar sua respectiva atividade no tópico de "Postagem de atividades"; passe do limite estipulado para cada avaliação da atividade; deixe de postar alguma aula/atividade; aplicação incorreta da avaliação, entre outros fatores que possam ser agregados com uma advertência.</p>
</div>
<section class="chapter"><h2>CAPÍTULO IV</h2></section>
<p>LICENÇA DE SERVIÇO E REINTEGRAÇÕES</p>
<article class="article"><p> <strong>Art. 13° -</strong> Membros que necessitarem se ausentar por um determinado período de tempo deverão solicitar um pedido de licença. O tempo mínimo para o afastamento deverá ser de 07 dias até o máximo de 30 dias, sendo permitida a reserva somente para casos específicos.</p></article>
<article class="article"><p> <strong>Art. 14° -</strong> A licença só poderá ser permitida em casos onde o membro também esteja afastado dos demais setores, ou seja, deverá estar em licença pelo Centro de Recursos Humanos.</p></article>
<article class="article"><p> <strong>Art. 15° -</strong> Os cargos de instrutor e coordenador poderão solicitar sua licença à qualquer membro do comando da subcompanhia. O Comando está isento de permissão, bastando apenas o aviso prévio aos demais membros da mesma.</p></article>
<article class="article"><p> <strong>Art. 16° -</strong> A reserva, período de licença superior à 30 dias, só poderá ser concedido aos membros que ocupem os cargos do comando, ou caso sejam membros do Estado-Maior. O tempo máximo que um membro pode passar em reserva será de 90 dias.</p></article>
<article class="article"><p> <strong>Art. 17° -</strong> Todos os membros em licença/reserva deverão postar o seu retorno em até 24 horas após o prazo final estabelecido, podendo regressar à suas funções antes do término previsto. Em caso de não cumprimento, o membro será expulso da academia.</p></article>
<article class="article"><p> <strong>Art. 18° -</strong> Todos os coordenadores+ que se reformem ou se desliguem de forma honrosa da instituição ou da academia poderão solicitar sua reintegração, devendo possuir permissão do comando. A reintegração deverá ser obrigatoriamente como instrutor, estando condicionada às vagas existentes para cada matéria.</p></article>
<article class="article"><p> <strong>Art. 19° -</strong> A reintegração tem um prazo de 06 meses para ser requerida, tendo o início do prazo contado a partir da saída da instituição, podendo ser feita em qualquer carreira, desde que esteja dentro do prazo. Caso o tempo seja excedido, o membro não terá mais direito à reintegração.</p></article>
<div class="card">
<p><strong>Parágrafo único.</strong> &nbsp;A reintegração só poderá ser usada uma vez, ressalvo caso o membro atinja o cargo de coordenador+ novamente.</p>
</div>
<article class="article"><p> <strong>Art. 20° -</strong> Membros que forem expulsos da academia, desligados de forma desonrosa ou exonerados da instituição, não terão direito a reintegração na academia.</p></article>
<section class="chapter"><h2>CAPÍTULO V</h2></section>
<p>SETOR DE FISCALIZAÇÃO</p>
<article class="article"><p> <strong>Art. 21° -</strong> O Setor de Fiscalização é um grupo que faz parte do setor de segurança da Academia de Polícia Militar, com objetivo de investigar casos internos, fiscalizar treinamentos, relatórios e grupos.</p></article>
<article class="article"><p> <strong>Art. 22° -</strong> A entrada de membros para o setor é feita de forma burocrática entre os membros.</p></article>
<article class="article"><p> <strong>Art. 23° -</strong> A hierarquia do Setor de Fiscalização divide-se em três (03) cargos, sendo eles:</p></article>
<div class="card">
<p><strong>Fiscalizador -</strong> Existem duas (02) vagas para o cargo;</p>
<p><strong>Vice-líder -</strong> Existem uma (01) vaga para o cargo;</p>
<p><strong>Líder -</strong> Existe uma (01) vaga para o cargo.</p>
</div>
<article class="article"><p> <strong>Art. 24° -</strong> O fiscalizador tem como função denunciar qualquer tipo de infração cometida pelos instrutores e coordenadores através das planilhas, como também fiscalizar os grupos envolvendo a Academia de Polícia Militar, retirando os policiais quando necessário.</p></article>
<article class="article"><p> <strong>Art. 25° -</strong> O vice-líder é responsável por garantir a segurança de toda a estrutura do grupo, e representar o líder em sua ausência.</p></article>
<article class="article"><p> <strong>Art. 26° -</strong> O líder é responsável por todo o grupo, é seu dever organizar e manter toda a estrutura do grupo.</p></article>
<section class="chapter"><h2>CAPÍTULO VI</h2></section>
<p>ESTRUTURA DA ACADEMIA</p>
<article class="article"><p> <strong>Art. 27° -</strong> É considerado propriedade física ou intelectual da Academia de Polícia Militar todos os quartos e grupos no Habblet Hotel que sejam direcionados a qualquer atividade da academia, o fórum da academia, assim como todo o conteúdo que esteja nele, bem como qualquer setor que esteja sob jurisdição da Academia de Polícia Militar.</p></article>
<div class="card">
<p><strong>Parágrafo único.</strong> &nbsp;As dependências da Academia de Polícia Militar são restritas a seus membros e policiais que estão recebendo seu curso, qualquer policial que não seja membro e que não esteja participando do curso fornecido pela academia, só poderá permanecer em uma das dependências da academia com autorização do comando da academia.</p>
</div>
<article class="article"><p> <strong>Art. 28° -</strong> A manutenção do fórum da Academia de Polícia Militar é realizada pelos moderadores do mesmo. Os moderadores são escolhidos pelo comando da academia, e não existe nenhum requisito básico para tal escolha.</p></article>
<article class="article"><p> <strong>Art. 29° -</strong> A manutenção de todas as dependências físicas da Academia de Polícia Militar no Habblet Hotel é realizada pelo comando.</p></article>
<article class="article"><p> <strong>Art. 30° -</strong> Qualquer alteração na estrutura, dependências físicas ou propriedades intelectuais (fórum da academia) da Academia de Polícia Militar, deve ser autorizada pelo comandante. Caso seja realizada qualquer alteração não permitida pelo comandante, o autor estará sujeito a punições. A punição será escolhida e efetuada pelo comandante após a análise do caso.</p></article>
<article class="article"><p> <strong>Art. 31° -</strong> Em caso de ataque a qualquer dependência da Academia de Polícia Militar, o autor e seus auxiliares serão imediatamente exonerado (tempo indeterminado) da Central Intelligence Agency.</p></article>
<section class="chapter"><h2>CAPÍTULO VII</h2></section>
<p>CONSIDERAÇÕES FINAIS</p>
<article class="article"><p> <strong>Art. 32° -</strong> As reuniões da Academia de Polícia Militar são realizadas sempre que o comando ver necessidade para realização. O comandante tem autonomia para alterar a data e/ou horário da reunião, ou até mesmo marcar mais de duas reuniões ao mês, se houver necessidade.</p></article>
<article class="article"><p> <strong>Art. 33° -</strong> Os membros que fazem parte da Academia da Polícia Militar têm a obrigação de comparecer em todas as atividades relacionadas com a mesma, em casos em que o membro não possa comparecer, o mesmo deverá apresentar uma justificativa plausível no tópico Quadro de Atividades.</p></article>
<div class="card">
<p><strong>Parágrafo único.</strong> &nbsp;O membro que não justificar a ausência das atividades levará 20 gratificações negativas efetivas.</p>
</div>
<article class="article"><p> <strong>Art. 34° -</strong> Os policiais que forem aprovados na Academia de Polícia Militar não terão que realizar o mesmo no futuro, se ainda tiverem registros de sua conclusão, com exceção dos banidos que perdem este direito.</p></article>
<article class="article"><p> <strong>Art. 35° -</strong> Quaisquer alterações neste documento devem obter a autorização prévia do Comando da Academia da Central Intelligence Agency.</p></article>

   localhost/127.0.0.1. Em system.policiacia.com (ou qualquer outro
   domínio) o ?dev=1 é ignorado e o login real é usado.
   Parâmetros extras: &nick=Fulano &cargo=Aluno &patente=Supervisor
                      &status=inativo &admin=1 &fora=1 (fora da APM)
                      &membros=60 (gera membros extras no Mural)
   ============================================================ */

const PARAMS = new URLSearchParams(location.search);
const HOSTS_LOCAIS = ['localhost', '127.0.0.1', '[::1]', '::1'];
const ehAmbienteLocal = location.protocol === 'file:' || HOSTS_LOCAIS.includes(location.hostname);
const MODO_DEV = PARAMS.get('dev') === '1' && ehAmbienteLocal && !/policiacia\.com$/i.test(location.hostname);
if (PARAMS.get('dev') === '1' && !MODO_DEV) console.warn('[APM] ?dev=1 ignorado: modo de teste só funciona em arquivo local ou localhost.');

const DEV_FIGURES = [
  'hr-115-42.hd-195-19.ch-3030-82.lg-275-1408.sh-295-62.ha-1012-110',
  'hr-893-45.hd-180-1.ch-255-82.lg-285-82.sh-290-62',
  'hr-515-33.hd-600-1.ch-635-70.lg-716-66-62.sh-735-68',
  'hr-100-61.hd-190-10.ch-215-66.lg-270-82.sh-300-64.ea-1404-63',
  'hr-831-49.hd-620-2.ch-665-71.lg-700-1408.sh-725-62',
];

function criarMockDev() {
  const nick = PARAMS.get('nick') || 'Lider';
  const cargo = PARAMS.get('cargo') || 'Comandante';
  const usuario = {

    status: PARAMS.get('status') || 'ativo',
    figure: DEV_FIGURES[0],
    administrador_sistema: PARAMS.get('admin') === '1' ? 1 : 0,
  };
  const membros = [
    // Nicks com pontuação de propósito, para testar layout e URL.
    { nick: '.:Persceu:.', cargo: 'Subcomandante' },
    { nick: 'Wingeet:', cargo: 'Coordenador' },
    { nick: 'DG17.', cargo: 'Coordenador' },
    { nick: '<b>Teste&"aspas"</b>', cargo: 'Coordenador' },
    { nick: 'Instrutor.Um', cargo: 'Instrutor' },
    { nick: 'Instrutor.Dois', cargo: 'Instrutor' },
    { nick: 'Aluno.Um', cargo: 'Aluno' },
    { nick: 'Aluno.Dois', cargo: 'Aluno' },
    { nick: 'Aluno.Tres', cargo: 'Aluno' },
  ];
  if (PARAMS.get('fora') !== '1') membros.unshift({ nick, cargo });
  const extras = Math.min(Number(PARAMS.get('membros')) || 0, 500);
  const cargosExtras = ['Instrutor', 'Aluno', 'Aluno', 'Aluno', 'Coordenador'];
  for (let i = 1; i <= extras; i++) membros.push({ nick: `Membro.${String(i).padStart(3, '0')}`, cargo: cargosExtras[i % cargosExtras.length] });
  membros.forEach((m, i) => figureCache.set(m.nick.toLowerCase(), Promise.resolve(DEV_FIGURES[i % DEV_FIGURES.length])));
  // Online simulado: alterna por posição. Responde com atraso, como a API real.
  const online = new Map(membros.map((m, i) => [m.nick.toLowerCase(), i % 3 !== 1]));

  const resposta = (dados, status = 200) => Promise.resolve({ ok: status < 400, status, json: () => Promise.resolve(dados) });
  return {
    auth: { estaLogado: () => true },
    apiFetch: (caminho) => caminho === '/usuarios/me' ? resposta(usuario) : resposta({ erro: 'mock' }, 404),
    apiSystem: (caminho) => {
      if (caminho === `grupos/${GRUPO_APM}/membros`) return Promise.resolve({ membros: membros.slice() });
      if (caminho.startsWith('usuarios/')) {
        const alvo = decodeURIComponent(caminho.slice('usuarios/'.length));
        if (mesmoNick(alvo, nick)) return Promise.resolve({ nick, grupos: [], online: true });
        return new Promise(r => setTimeout(() => r({ nick: alvo, online: online.get(alvo.toLowerCase()) === true }), 20));
      }
      return Promise.reject(new Error('mock: rota não simulada ' + caminho));
    },
  };
}

/* ============================================================
   UTIL
   ============================================================ */

function escapeHtml(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Minúsculas, sem acentos e sem espaços nas pontas.
const normalizar = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').trim().toLowerCase();
const mesmoNick = (a, b) => normalizar(a) === normalizar(b);
const cargoNaLista = (cargo, lista) => lista.some(c => normalizar(c) === normalizar(cargo));
const linkSeguro = (url) => /^https?:\/\//i.test(String(url || '').trim()) ? String(url).trim() : '';

function mostrarToast(mensagem, tipo = 'info') {
  const toast = document.getElementById('apm-toast');
  toast.textContent = mensagem;
  toast.className = `toast ${tipo} show`;
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

/* ============================================================
   AVATARES (mesmo padrão do INS.html)
   ============================================================ */

// Nick como segmento de URL: encodeURIComponent não codifica "." — um nick
// como "DG17." ou ".:Persceu:." poderia ter o ponto final cortado ou virar
// "." / ".." no caminho, então o ponto também vira %2E.
const nickNaUrl = (nick) => encodeURIComponent(String(nick)).replace(/\./g, '%2E');
const HABBLET_PLAYER_API = (nick) => `https://api.habblet.city/player/${nickNaUrl(nick)}`;
const AVATAR_PLACEHOLDER = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==';
const figureCache = new Map();

const AVATAR_TAMANHOS = {
  b: {
    canvas: { w: 90, h: 130 },
    box: { cabeca: { x: 28, y: 38, w: 36, h: 32 }, corpo: { x: 28, y: 38, w: 39, h: 82 } },
  },
  l: {
    canvas: { w: 180, h: 260 },
    box: { cabeca: { x: 58, y: 74, w: 72, h: 67 }, corpo: { x: 58, y: 74, w: 65, h: 167 } },
  },
};
const AVATAR_LIMITE_ESCALA_B = 1.4;

let usuarioMe = null; // resposta de /usuarios/me

function obterFigure(nick) {
  const key = nick.toLowerCase();
  if (usuarioMe && usuarioMe.figure && key === String(usuarioMe.nick).toLowerCase()) return Promise.resolve(usuarioMe.figure);
  if (!figureCache.has(key)) {
    const promise = fetch(HABBLET_PLAYER_API(nick))
      .then(r => r.ok ? r.json() : null)
      .then(d => (d && d.figure) ? d.figure : null)
      .catch(() => null);
    figureCache.set(key, promise);
  }
  return figureCache.get(key);
}

function urlAvatarPorFigure(figure, modo, tamanhoServidor) {
  const params = new URLSearchParams({ figure, size: tamanhoServidor });
  if (modo === 'cabeca') params.set('headonly', '1');
  if (modo === 'mural') { params.set('direction', '2'); params.set('head_direction', '2'); }
  return `https://imaging.habblet.city/avatarimage?${params.toString()}`;
}

async function resolverAvatares(escopoEl) {
  if (!escopoEl) return;
  const imgs = Array.from(escopoEl.querySelectorAll('img[data-avatar-nick]'));
  const nicksUnicos = [...new Set(imgs.map(img => img.dataset.avatarNick))];
  await Promise.all(nicksUnicos.map(async (nick) => {
    const figure = await obterFigure(nick);
    if (!figure) return;
    imgs.filter(img => img.dataset.avatarNick === nick).forEach(img => {
      const modo = img.dataset.avatarModo || 'cabeca';
      const tamanhoServidor = img.dataset.avatarTamanho || 'b';
      img.src = urlAvatarPorFigure(figure, modo, tamanhoServidor);
    });
  }));
}

function avatarCropHtml(nick, { modo = 'cabeca', largura = 32, raio = 8, padding = 0, borda = false } = {}) {
  const boxB = AVATAR_TAMANHOS.b.box[modo] || AVATAR_TAMANHOS.b.box.cabeca;
  const precisaDeL = (largura / boxB.w) > AVATAR_LIMITE_ESCALA_B;
  const tamanhoServidor = precisaDeL ? 'l' : 'b';

  const { canvas, box } = AVATAR_TAMANHOS[tamanhoServidor];
  const boxModo = box[modo] || box.cabeca;
  const escala = largura / boxModo.w;
  const alturaExibida = Math.round(boxModo.h * escala);

  const larguraCaixa = largura + padding * 2;
  const alturaCaixa = alturaExibida + padding * 2;
  const bordaCss = borda ? 'border:1px solid var(--apm-border);' : '';

  if (!nick) {
    return `<div class="avatar-crop" style="width:${larguraCaixa}px;height:${alturaCaixa}px;border-radius:${raio}px;background:transparent;"></div>`;
  }

  const imgW = Math.round(canvas.w * escala);
  const imgH = Math.round(canvas.h * escala);
  const left = padding - Math.round(boxModo.x * escala);
  const top = padding - Math.round(boxModo.y * escala);

  return `
    <div class="avatar-crop" style="width:${larguraCaixa}px;height:${alturaCaixa}px;border-radius:${raio}px;${bordaCss}background:transparent">
      <img src="${AVATAR_PLACEHOLDER}" alt=""
           data-avatar-nick="${escapeHtml(nick)}"
           data-avatar-modo="${modo}"
           data-avatar-tamanho="${tamanhoServidor}"
           style="width:${imgW}px;height:${imgH}px;left:${left}px;top:${top}px;"
           loading="lazy">
    </div>`;
}

/* ============================================================
   API DO SYSTEM
   ============================================================ */

let MOCK = null; // preenchido só no modo de teste

const obterAuth = () => MOCK ? MOCK.auth : Auth;           // eslint-disable-line no-undef
const chamarApiFetch = (c) => MOCK ? MOCK.apiFetch(c) : apiFetch(c); // eslint-disable-line no-undef

// API_BASE vem de /assets/api.js (não redeclarar aqui). É lido só na hora
// da chamada, depois que o api.js já foi carregado.
function caminhosPublicos() {
  const base = (typeof API_BASE !== 'undefined') ? API_BASE : ''; // eslint-disable-line no-undef
  return [...new Set([`${base}/publico`, `${base}/api/publico`, '/api/publico'])];
}
let caminhoPublico = null;

async function apiSystem(caminho) {
  if (MOCK) return MOCK.apiSystem(caminho);
  const bases = caminhoPublico ? [caminhoPublico] : caminhosPublicos();
  let ultimoStatus = 0;
  for (const base of bases) {
    try {
      const resp = await fetch(`${base}/${caminho}`);
      ultimoStatus = resp.status;
      if (resp.ok) {
        caminhoPublico = base;
        return resp.json();
      }
      if (resp.status !== 404) break;   // 404 = caminho errado, tenta o próximo
    } catch (err) { /* CORS/rede: tenta o próximo */ }
  }
  throw new Error(`System ${caminho}: status ${ultimoStatus}`);
}

// api.js só é carregado se a página ainda não o tiver (o layout do System
// já o inclui — carregar de novo dá "API_BASE has already been declared").
function garantirApiJs() {
  if (MOCK) return Promise.resolve();
  if (typeof Auth !== 'undefined' && typeof apiFetch === 'function') return Promise.resolve(); // eslint-disable-line no-undef
  return new Promise((resolve, reject) => {
    const tag = document.createElement('script');
    tag.src = '/assets/api.js';
    tag.onload = resolve;
    tag.onerror = () => reject(new Error('Não foi possível carregar /assets/api.js'));
    document.head.appendChild(tag);
  });
}

let nickLogado = '';
let patenteUsuario = '';
let cargoAPM = '';
let ehAdminSystem = false;
let podeComando = false;     // CARGOS_RESTRITOS ou administrador do System
let membrosAPM = [];
let erroSistema = false;
let dadosCarregados = false;

const MODULOS = CONFIG.modulos.filter(m => m.ativo !== false && m.id);

/* ---------- Patentes ("X ou superior") ---------- */

// "1º Sargento" -> "sargento", "Vice-Presidente" -> "vice presidente"
const chavePatente = (nome) => normalizar(nome)
  .replace(/[°ºª]/g, '').replace(/-/g, ' ').replace(/^\d+\s*/, '').replace(/\s+/g, ' ').trim();

const ORDEM_PATENTES_CHAVE = CONFIG.ordemPatentes.map(chavePatente);
const EQUIVALENCIA_CHAVE = Object.fromEntries(
  Object.entries(CONFIG.equivalenciaPatentes).map(([k, v]) => [chavePatente(k), chavePatente(v)]));

// Posição da patente na ordem; -1 = desconhecida (sem acesso).
function rankPatente(nome) {
  let k = chavePatente(nome);
  if (!k) return -1;
  if (EQUIVALENCIA_CHAVE[k]) k = EQUIVALENCIA_CHAVE[k];
  return ORDEM_PATENTES_CHAVE.indexOf(k);
}

function patenteAtende(minima) {
  const alvo = rankPatente(minima);
  const atual = rankPatente(patenteUsuario);
  return alvo >= 0 && atual >= 0 && atual >= alvo;
}

/* ---------- Acesso aos módulos ---------- */

function moduloBloqueado(modulo) {
  if (ehAdminSystem || cargoNaLista(cargoAPM, CONFIG.cargosAcessoTotalAcademy)) return false;
  if (modulo.patenteMinima && !patenteAtende(modulo.patenteMinima)) return true;
  if (modulo.cargos && modulo.cargos.length && !cargoNaLista(cargoAPM, modulo.cargos)) return true;
  return false;
}

function requisitoModulo(modulo) {
  const partes = [];
  if (modulo.patenteMinima) partes.push(`Patente ${modulo.patenteMinima} ou superior`);
  if (modulo.cargos && modulo.cargos.length) partes.push(`${modulo.cargos.join(' ou ')} da APM`);
  return partes.length ? partes.join(' + ') : 'Todos os membros';
}

const mensagemBloqueioModulo = (modulo) => `Este módulo requer: ${requisitoModulo(modulo)}.`;

// Destaca os marcadores [PREENCHER ...] (recebe texto JÁ escapado).
const destacarPreencher = (htmlEscapado) =>
  htmlEscapado.replace(/\[PREENCHER[^\]]*\]/g, m => `<mark class="apm-preencher">${m}</mark>`);

/* ============================================================
   CARREGAMENTO INICIAL
   Devolve null se liberado, ou o tipo de bloqueio.
   ============================================================ */

async function carregarDadosIniciais() {
  const auth = obterAuth();
  if (typeof auth === 'undefined' || typeof auth.estaLogado !== 'function') {
    throw new Error('Não foi possível carregar /assets/api.js');
  }
  if (!auth.estaLogado()) {
    window.location.href = '/login.html';
    return new Promise(() => {});              // interrompe o carregamento
  }
  const respMe = await chamarApiFetch('/usuarios/me');
  if (!respMe.ok) return new Promise(() => {}); // 401 sem renovação já redireciona
  usuarioMe = await respMe.json();

  nickLogado = String(usuarioMe.nick || '').trim();
  patenteUsuario = String(usuarioMe.patente_nome || '').trim();
  ehAdminSystem = Number(usuarioMe.administrador_sistema) === 1;

  // Conta não ativa: bloqueia antes de qualquer coisa (inclusive admin).
  // Sem o campo status, segue o mesmo critério do INS.html (considera ativo).
  const status = normalizar(usuarioMe.status);
  if (status && status !== 'ativo') return { tipo: 'inativo', status: usuarioMe.status };

  const [publicoRes, membrosRes] = await Promise.all([
    apiSystem(`usuarios/${nickNaUrl(nickLogado)}`).catch(() => null),
    apiSystem(`grupos/${GRUPO_APM}/membros`).catch(() => null),
  ]);

  erroSistema = !membrosRes;
  membrosAPM = (Array.isArray(membrosRes) ? membrosRes : (membrosRes?.membros || []))
    .filter(m => m && m.nick);

  const membro = membrosAPM.find(m => mesmoNick(m.nick, nickLogado)) || null;
  const grupoPublico = (publicoRes?.grupos || []).find(g => normalizar(g.codigo) === normalizar(GRUPO_APM)) || null;
  cargoAPM = String(membro?.cargo || grupoPublico?.cargo || '').trim();
  const ehMembro = !!membro || !!grupoPublico;

  if (!ehMembro && !ehAdminSystem) {
    return { tipo: erroSistema ? 'erro' : 'fora' };
  }

  podeComando = ehAdminSystem || cargoNaLista(cargoAPM, CARGOS_RESTRITOS);
  console.info('[APM]', { nick: nickLogado, cargo: cargoAPM, admin: ehAdminSystem, comando: podeComando, dev: !!MOCK });

  dadosCarregados = true;
  return null;
}

const ROTAS = [
  { rota: '/',          titulo: 'Início',             icone: 'fa-house',          render: renderInicio },
  { rota: '/academy',   titulo: 'E-Academy',          icone: 'fa-graduation-cap', render: renderAcademy },
  { rota: '/mural',     titulo: 'Mural',              icone: 'fa-users',          render: renderMural },
  { rota: '/regimento', titulo: 'Regimento Interno',  icone: 'fa-scale-balanced', render: renderRegimento },
  { rota: '/comando',   titulo: 'Área do Comando',    icone: 'fa-star',           render: renderComando, restrita: true },
];

const rotaLiberada = (r) => !r.restrita || podeComando;

function renderNav(rotaAtual) {
  const nav = document.getElementById('apm-nav');
  const item = (r) => {
    const ativo = rotaAtual === r.rota || (r.rota !== '/' && rotaAtual.startsWith(r.rota + '/'));
    const bloqueada = !rotaLiberada(r);
    return `
      <a href="#${r.rota}" data-route="${r.rota}" class="nav-item ${ativo ? 'active' : ''} ${bloqueada ? 'locked' : ''}"
         ${bloqueada ? 'title="Restrito ao Comando da APM"' : ''}>
        <i class="fa-solid ${r.icone}"></i> ${escapeHtml(r.titulo)}
        ${bloqueada ? '<i class="fa-solid fa-lock nav-lock"></i>' : ''}
      </a>`;
  };
  nav.innerHTML =
    ROTAS.filter(r => !r.restrita).map(item).join('') +
    `<p class="nav-secao-label">Comando</p>` +
    ROTAS.filter(r => r.restrita).map(item).join('');
}

function voltarAoInicio(mensagem) {
  if (mensagem) mostrarToast(mensagem, 'error');
  history.replaceState(null, '', location.pathname + location.search + '#/');
  renderNav('/');
  renderInicio();
}

function router() {
  fecharMenuMobile();
  if (!dadosCarregados) return; // init() chama router() de novo ao terminar

  const rota = (location.hash.replace(/^#/, '') || '/').replace(/\/+$/, '') || '/';
  window.scrollTo(0, 0);

  // Módulo da E-Academy: #/academy/{id}
  const moduloMatch = rota.match(/^\/academy\/(.+)$/);
  if (moduloMatch) {
    const modulo = MODULOS.find(m => m.id === decodeURIComponent(moduloMatch[1]));
    if (!modulo) return voltarAoInicio('Módulo não encontrado.');
    // Mesma checagem do clique: digitar a URL não pula o cadeado.
    if (moduloBloqueado(modulo)) {
      mostrarToast(mensagemBloqueioModulo(modulo), 'error');
      history.replaceState(null, '', location.pathname + location.search + '#/academy');
      renderNav('/academy');
      return renderAcademy();
    }
    if (!linkSeguro(modulo.link)) {
      mostrarToast('Este módulo ainda não tem conteúdo publicado.', 'info');
      history.replaceState(null, '', location.pathname + location.search + '#/academy');
      renderNav('/academy');
      return renderAcademy();
    }
    renderNav(rota);
    return renderModulo(modulo);
  }

  const def = ROTAS.find(r => r.rota === rota);
  if (!def) return voltarAoInicio();
  // Rota restrita: valida aqui também, não só escondendo/trancando o menu.
  if (!rotaLiberada(def)) return voltarAoInicio('Área restrita ao Comando da APM (' + CARGOS_RESTRITOS.join(', ') + ').');

  renderNav(rota);
  def.render();
}

function ordemCargo(cargo) {
  const i = CARGOS_RESTRITOS.findIndex(c => normalizar(c) === normalizar(cargo));
  return i >= 0 ? i : CARGOS_RESTRITOS.length;
}

// Posição do cargo no Mural: ordemMural primeiro, depois os demais (alfabético).
function ordemMural(cargo) {
  const i = CONFIG.ordemMural.findIndex(c => normalizar(c) === normalizar(cargo));
  return i >= 0 ? i : CONFIG.ordemMural.length;
}

const compararTexto = (a, b) => String(a || '').localeCompare(String(b || ''), 'pt-BR', { sensitivity: 'base' });

function membrosOrdenadosMural() {
  return membrosAPM.slice().sort((a, b) =>
    (ordemMural(a.cargo) - ordemMural(b.cargo)) ||
    (ordemMural(a.cargo) === CONFIG.ordemMural.length ? compararTexto(a.cargo, b.cargo) : 0) ||
    compararTexto(a.nick, b.nick));
}

/* ---------- Status online (bolinha) ----------
   Busca /usuarios/{nick} de cada membro em paralelo (até 8 por vez), depois
   que os cards já estão na tela. Resultado fica em cache durante a visita. */
const statusOnline = new Map(); // nick minúsculo -> true | false
let statusCarregando = null;

function aplicarStatus(escopo) {
  escopo.querySelectorAll('[data-status-nick]').forEach(el => {
    const valor = statusOnline.get(el.dataset.statusNick.toLowerCase());
    if (valor === undefined) return;
    el.classList.remove('carregando');
    el.classList.toggle('online', valor === true);
    el.classList.toggle('offline', valor !== true);
    el.title = valor === true ? 'Online' : 'Offline';
    el.setAttribute('aria-label', el.title);
    // visual: o card sabe o status (avatar em cinza quando offline)
    const card = el.closest('.mural-card');
    if (card) { card.classList.toggle('online', valor === true); card.classList.toggle('offline', valor !== true); }
  });
}

function carregarStatusMembros() {
  if (statusCarregando) return statusCarregando;
  const fila = membrosAPM.map(m => m.nick).filter(n => !statusOnline.has(n.toLowerCase()));
  const trabalhador = async () => {
    while (fila.length) {
      const nick = fila.shift();
      let online = false;
      try { online = (await apiSystem(`usuarios/${nickNaUrl(nick)}`))?.online === true; } catch (e) { /* offline */ }
      statusOnline.set(nick.toLowerCase(), online);
      const app = document.getElementById('apm-app');
      if (app.querySelector('.mural-grid')) aplicarStatus(app);
    }
  };
  statusCarregando = Promise.all(Array.from({ length: Math.min(8, fila.length) }, trabalhador))
    .finally(() => { statusCarregando = null; });
  return statusCarregando;
}

// Medidas do busto em pixels de tela, a partir de CONFIG.muralAvatar.

  const { escala, cintura, xInicio, xFim } = CONFIG.muralAvatar;

    janelaW: Math.round((xFim - xInicio) * escala),   // largura visível
    janelaH: Math.round(cintura * escala),            // da borda de cima da imagem até a cintura
    imgW: Math.round(180 * escala),
    imgH: Math.round(260 * escala),
    left: -Math.round(xInicio * escala),
  };
}

// Busto do Habblet: a janela termina exatamente na cintura (base do card),
// então perna e pé ficam sempre fora. O espaço transparente acima não aparece.
function bustoMuralHtml(nick) {

// O texto do Regimento fica no <template id="apm-regimento-fonte"> no fim da página.
// Trabalha com os blocos de primeiro nível do texto (capítulo, artigo, card, tabela):
// Capítulos: blocos que começam com "CAPÍTULO I", "CAPÍTULO II"...
// Artigos: blocos que começam com "Art. N"; o que vem depois (cards com §,
// incisos, parágrafo único, tabela) pertence ao artigo até o próximo artigo/capítulo.
const RE_CAPITULO = /^CAP[ÍI]TULO\s+([IVXLC]+)\b/i;
const RE_ARTIGO = /^Art\.?\s*(\d+)/i;

function estruturarRegimento(texto) {
  // Desce por invólucros de um filho só (ex.: <div> envolvendo tudo)
  let raiz = texto;
  while (raiz.children.length === 1 && raiz.firstElementChild.children.length > 0) raiz = raiz.firstElementChild;
  const blocos = [...raiz.children];
  const capitulos = [], artigos = [], soltos = [];
  let cap = null, art = null;
  blocos.forEach(el => {
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    if (!t) return;
    const mCap = t.match(RE_CAPITULO);
    const mArt = t.match(RE_ARTIGO);
    if (mCap) {
      cap = { numero: mCap[1].toUpperCase(), titulo: t, subtitulo: '', el, blocos: [el], artigos: [] };
      el.id = 'apm-reg-cap-' + cap.numero;
      el.classList.add('reg-capitulo');
      capitulos.push(cap); art = null;
    } else if (mArt) {
      art = { numero: Number(mArt[1]), cap, blocos: [el] };
      el.classList.add('reg-artigo-inicio');
      artigos.push(art); if (cap) cap.artigos.push(art);
    } else if (art) {
      art.blocos.push(el);
    } else if (cap) {
      // Nome do capítulo logo abaixo de "CAPÍTULO I" (ex.: "DAS DISPOSIÇÕES GERAIS")
      if (!cap.subtitulo && cap.blocos.length === 1 && t.length < 140) { cap.subtitulo = t; el.classList.add('reg-capitulo-nome'); }
      cap.blocos.push(el);
    } else {
      soltos.push(el);
    }
  });
  return { capitulos, artigos, soltos };
}

// Destaque da busca, ignorando maiúsculas e acentos.
function removerDestaques(escopo) {
  escopo.querySelectorAll('mark.reg-destaque').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  escopo.normalize();
}
function destacarTermo(el, termo) {
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nos = [];
  while (walker.nextNode()) nos.push(walker.currentNode);
  nos.forEach(no => {
    const original = no.nodeValue;
    // normaliza caractere a caractere para manter as posições do texto original
    const norm = [...original].map(c => { const n = normalizar(c); return n.length === 1 ? n : c.toLowerCase(); }).join('');
    if ([...original].length !== original.length) return; // texto com emoji/surrogates: só filtra, não destaca
    let i = norm.indexOf(termo), ultimo = 0;
    if (i < 0) return;
    const frag = document.createDocumentFragment();
    while (i >= 0) {
      frag.appendChild(document.createTextNode(original.slice(ultimo, i)));
      const mark = document.createElement('mark');
      mark.className = 'reg-destaque';
      mark.textContent = original.slice(i, i + termo.length);
      frag.appendChild(mark);
      ultimo = i + termo.length;
      i = norm.indexOf(termo, ultimo);
    }
    frag.appendChild(document.createTextNode(original.slice(ultimo)));
    no.replaceWith(frag);
  });
}

  const texto = document.getElementById('apm-reg-texto');

  // O CSS do regimento é o .apm-regimento acima; nada do arquivo original roda ou vaza.
  texto.querySelectorAll('script, style, link, meta, title, iframe, object, embed').forEach(e => e.remove());
  texto.querySelectorAll('*').forEach(el => [...el.attributes].forEach(a => {

  const sumario = document.getElementById('apm-reg-sumario');
  if (!capitulos.length) document.getElementById('apm-reg-sumario-box').hidden = true;
  sumario.innerHTML = capitulos.map((c, i) => `
    <button type="button" class="reg-sumario-item" data-cap="${i}">
      <span class="reg-sumario-num">${escapeHtml(c.numero)}</span>
      <span class="reg-sumario-nome">${escapeHtml(c.subtitulo || c.titulo)}</span>
    </button>`).join('');
  sumario.querySelectorAll('[data-cap]').forEach(btn => btn.addEventListener('click', () => {
    capitulos[Number(btn.dataset.cap)].el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));

  // Busca: filtra artigos e destaca o termo
  const busca = document.getElementById('apm-reg-busca');
  const contagem = document.getElementById('apm-reg-contagem');
  const vazio = document.getElementById('apm-reg-vazio');
  const todosBlocos = [...new Set([...soltos, ...capitulos.flatMap(c => c.blocos), ...artigos.flatMap(a => a.blocos)])];

  const filtrar = () => {
    const termo = normalizar(busca.value);
    removerDestaques(texto);
    if (!termo) {
      todosBlocos.forEach(el => el.classList.remove('reg-oculto'));
      sumario.querySelectorAll('[data-cap]').forEach(b => b.classList.remove('reg-sem-resultado'));
      contagem.textContent = ''; vazio.hidden = true; texto.hidden = false;
      return;
    }
    const mNum = termo.match(/^art\.?\s*(\d+)$/);
    const casa = (a) => mNum ? a.numero === Number(mNum[1])
                             : normalizar(a.blocos.map(b => b.textContent).join(' ')).includes(termo);
    const achados = new Set(artigos.filter(casa));
    todosBlocos.forEach(el => el.classList.add('reg-oculto'));
    achados.forEach(a => a.blocos.forEach(el => {
      el.classList.remove('reg-oculto');
      if (!mNum) destacarTermo(el, termo);
    }));
    capitulos.forEach((c, i) => {
      const tem = c.artigos.some(a => achados.has(a));
      if (tem) c.blocos.forEach(el => el.classList.remove('reg-oculto'));
      sumario.querySelector(`[data-cap="${i}"]`)?.classList.toggle('reg-sem-resultado', !tem);
    });
    contagem.textContent = `${achados.size} artigo${achados.size === 1 ? '' : 's'}`;
    vazio.hidden = achados.size > 0; texto.hidden = achados.size === 0;
  };
  let espera = null;
  busca.addEventListener('input', () => { clearTimeout(espera); espera = setTimeout(filtrar, 150); });
  busca.addEventListener('keydown', (e) => { if (e.key === 'Escape') { busca.value = ''; filtrar(); } });
}

/* ============================================================
   PÁGINA: ÁREA DO COMANDO (restrita)
   ============================================================ */

function renderComando() {
  if (!podeComando) return voltarAoInicio('Área restrita ao Comando da APM.'); // defesa extra
  const app = document.getElementById('apm-app');

  const porCargo = {};
  membrosAPM.forEach(m => { const c = m.cargo || 'Sem cargo'; porCargo[c] = (porCargo[c] || 0) + 1; });
  const cargosOrdenados = Object.entries(porCargo)
    .sort((a, b) => (ordemCargo(a[0]) - ordemCargo(b[0])) || b[1] - a[1]);
  const links = (CONFIG.linksComando || []).filter(l => linkSeguro(l.link));

  app.innerHTML = `
    <div class="max-w-6xl mx-auto w-full">
      ${cabecalhoPagina('Área do Comando', 'Visível apenas para ' + CARGOS_RESTRITOS.join(', ') + ' e administradores', 'fa-star')}

      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="glass-card p-5">
          <p class="text-xs text-subtle font-semibold mb-1">Total de membros</p>
          <p class="text-2xl font-extrabold text-primary">${membrosAPM.length}</p>
        </div>
        ${cargosOrdenados.slice(0, 3).map(([c, n]) => `
          <div class="glass-card p-5">
            <p class="text-xs text-subtle font-semibold mb-1 truncate">${escapeHtml(c)}</p>
            <p class="text-2xl font-extrabold">${n}</p>
          </div>`).join('')}
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="glass-card p-6 lg:col-span-2">
          <p class="text-sm font-bold mb-4">Efetivo por cargo</p>
          ${cargosOrdenados.length === 0 ? '<p class="text-sm text-muted">Sem dados de membros.</p>' : `
            <div class="flex flex-col gap-3">
              ${cargosOrdenados.map(([c, n]) => {
                const pct = membrosAPM.length ? Math.round(n / membrosAPM.length * 100) : 0;
                return `
                  <div>
                    <div class="flex justify-between text-xs mb-1"><span class="font-semibold">${escapeHtml(c)}</span><span class="text-subtle">${n} · ${pct}%</span></div>
                    <div class="h-2 rounded-full" style="background:var(--apm-hover);">
                      <div class="h-2 rounded-full" style="width:${pct}%;background:var(--apm-primary);"></div>
                    </div>
                  </div>`;
              }).join('')}
            </div>`}
        </div>

        <div class="glass-card p-6">
          <p class="text-sm font-bold mb-4">Atalhos do Comando</p>
          ${links.length === 0 ? `
            <p class="text-sm text-muted">Nenhum atalho cadastrado. Adicione em <code class="text-xs">CONFIG.linksComando</code> no topo do script.</p>` : `
            <div class="flex flex-col gap-2">
              ${links.map(l => `
                <a href="${escapeHtml(linkSeguro(l.link))}" target="_blank" rel="noopener" class="nav-item" style="padding:10px 12px;">
                  <i class="fa-solid ${escapeHtml(l.icone || 'fa-link')} text-primary"></i>
                  <span class="min-w-0"><span class="block truncate">${escapeHtml(l.titulo)}</span>
                  ${l.descricao ? `<span class="block text-xs font-normal text-subtle truncate">${escapeHtml(l.descricao)}</span>` : ''}</span>
                </a>`).join('')}
            </div>`}
        </div>
      </div>
    </div>`;
}

function abrirMenuMobile() {
  document.getElementById('apm-sidebar').classList.add('open');
  document.getElementById('apm-sidebar-backdrop').classList.add('open');
}
function fecharMenuMobile() {
  document.getElementById('apm-sidebar').classList.remove('open');
  document.getElementById('apm-sidebar-backdrop').classList.remove('open');
}

document.getElementById('apm-btn-abrir-menu').addEventListener('click', abrirMenuMobile);
document.getElementById('apm-btn-fechar-menu').addEventListener('click', fecharMenuMobile);
document.getElementById('apm-sidebar-backdrop').addEventListener('click', fecharMenuMobile);
document.getElementById('apm-sidebar').addEventListener('click', (e) => {
  if (e.target.closest('a[data-route]')) fecharMenuMobile();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharMenuMobile(); });

/* ============================================================
   INIT
   ============================================================ */

window.addEventListener('hashchange', router);

function aplicarLogo() {
  const url = linkSeguro(CONFIG.logo);
  if (!url) return;
  document.querySelectorAll('.apm-logo-slot').forEach(el => {
    el.style.background = 'transparent';
    el.innerHTML = `<img src="${escapeHtml(url)}" alt="APM">`;
  });
}

async function iniciarAPM() {
  aplicarLogo();

  if (MODO_DEV) {
    MOCK = criarMockDev();
    const badge = document.createElement('div');
    badge.id = 'apm-dev-badge';
    badge.innerHTML = '<i class="fa-solid fa-flask"></i> MODO TESTE (usuário simulado)';
    document.body.appendChild(badge);
  }

  const app = document.getElementById('apm-app');
  app.innerHTML = `
    <div class="max-w-6xl mx-auto w-full">
      <div class="glass-card p-8 mb-6"><div class="skeleton" style="height:120px;"></div></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        ${Array.from({ length: 4 }).map(() => `<div class="glass-card p-5"><div class="skeleton" style="height:90px;"></div></div>`).join('')}
      </div>
    </div>`;

  let bloqueio = null;
  try {
    await garantirApiJs();
    bloqueio = await carregarDadosIniciais();
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="glass-card p-10 text-center"><p class="text-red-600 text-sm">Falha ao carregar dados: ${escapeHtml(err.message)}</p>
      ${ehAmbienteLocal && !MODO_DEV ? '<p class="text-xs text-muted mt-2">Testando fora do System? Abra com <code>?dev=1</code> no final do endereço.</p>' : ''}</div>`;
    return;
  }

  if (bloqueio) return tratarBloqueio(bloqueio);
  router();
}

// Roda já se o DOM estiver pronto (página injetada no layout do System).
if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', iniciarAPM);
else iniciarAPM();

})();
</script>
